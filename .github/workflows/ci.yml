name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-test-password
          MYSQL_DATABASE: reconcile_test
          MYSQL_USER: reconcile_test
          MYSQL_PASSWORD: synthetic-db-test-password
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -psynthetic-root-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server
      - run: npm run test:e2e
